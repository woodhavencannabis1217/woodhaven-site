<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WH Versions">
<meta name="theme-color" content="#1a1a2e">
<title>Version Manager — Woodhaven Cannabis</title>
<style>
:root {
  --navy: #1a1a2e;
  --teal: #00c9a7;
  --teal-light: #e0f7f4;
  --orange: #e65100;
  --red: #c62828;
  --green: #2e7d32;
  --purple: #7b1fa2;
  --purple-light: #f3e5f5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

/* ══ HEADER ═══════════════════════════════════════════════════════ */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, #16213e 100%);
  color: white;
  padding: 18px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(0,0,0,0.35);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
.header p { font-size: 11px; opacity: 0.55; margin-top: 2px; }
.home-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: white;
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  flex-shrink: 0;
}
.version-count {
  font-size: 11px;
  opacity: 0.5;
  margin-top: 8px;
}

/* ══ CONTENT ══════════════════════════════════════════════════════ */
.content { padding: 14px; max-width: 540px; margin: 0 auto; }

/* ══ CURRENT VERSION BANNER ══════════════════════════════════════ */
.current-banner {
  background: linear-gradient(135deg, var(--teal), #00b894);
  color: white;
  border-radius: 14px;
  padding: 18px 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,201,167,0.25);
  position: relative;
  overflow: hidden;
}
.current-banner::after {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.current-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.8;
  margin-bottom: 6px;
}
.current-name {
  font-size: 20px;
  font-weight: 800;
}
.current-date {
  font-size: 12px;
  opacity: 0.75;
  margin-top: 4px;
}
.current-desc {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 8px;
  line-height: 1.4;
}

/* ══ TIMELINE ════════════════════════════════════════════════════ */
.timeline { position: relative; }

.timeline-item {
  display: flex;
  gap: 14px;
  position: relative;
  padding-bottom: 20px;
}
.timeline-item:last-child { padding-bottom: 0; }

/* Vertical line */
.timeline-track {
  width: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  position: relative;
}
.timeline-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--teal);
  border: 3px solid #e0f7f4;
  flex-shrink: 0;
  z-index: 2;
  margin-top: 18px;
}
.timeline-dot.current {
  width: 18px; height: 18px;
  border: 3px solid var(--teal);
  background: white;
  box-shadow: 0 0 0 4px rgba(0,201,167,0.2);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(0,201,167,0.2); }
  50% { box-shadow: 0 0 0 8px rgba(0,201,167,0.1); }
}
.timeline-line {
  width: 2px;
  flex: 1;
  background: #e0e0e0;
  margin-top: 4px;
}
.timeline-item:last-child .timeline-line { display: none; }

/* Version card */
.version-card {
  flex: 1;
  background: white;
  border-radius: 14px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
  overflow: hidden;
}
.vc-header {
  padding: 14px 14px 0;
}
.vc-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
}
.vc-date {
  font-size: 11px;
  color: #aaa;
  margin-top: 2px;
}
.vc-desc {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  padding: 8px 14px 0;
}
.vc-files {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 14px;
}
.file-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  background: #f0f2f5;
  color: #666;
}
.file-badge.html { background: #e3f2fd; color: #1565c0; }
.file-badge.json { background: #fff3e0; color: #e65100; }
.file-badge.js   { background: #fff8e1; color: #f57f17; }

/* Restore button */
.restore-btn {
  width: 100%;
  padding: 12px 14px;
  border: none;
  border-top: 1px solid #f0f0f0;
  background: white;
  color: var(--teal);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s;
}
.restore-btn:active { background: var(--teal-light); }
.restore-btn.copied {
  background: var(--teal);
  color: white;
}
.restore-btn.is-current {
  color: #ccc;
  cursor: default;
  font-weight: 500;
}

/* ══ HELP CARD ═══════════════════════════════════════════════════ */
.help-card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
  padding: 18px 16px;
  margin-top: 20px;
}
.help-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 12px;
}
.help-step {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}
.help-step:last-child { margin-bottom: 0; }
.help-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--teal-light);
  color: var(--teal);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.help-text {
  font-size: 13px;
  color: #555;
  line-height: 1.5;
}
.help-text strong { color: var(--navy); }
.help-note {
  margin-top: 14px;
  padding: 10px 12px;
  background: #f8f9fa;
  border-radius: 8px;
  font-size: 11px;
  color: #888;
  line-height: 1.6;
}

/* ══ EMPTY STATE ═════════════════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #aaa;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; color: #888; margin-bottom: 6px; }
.empty-state p { font-size: 13px; line-height: 1.5; }

/* ══ LOADING ═════════════════════════════════════════════════════ */
.loading {
  text-align: center;
  padding: 40px;
  color: #aaa;
  font-size: 14px;
}
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────── -->
<div class="header">
  <div class="header-top">
    <div>
      <h1>🕐 Version Manager</h1>
      <p>Woodhaven Cannabis — App History</p>
    </div>
    <a href="index.html" class="home-btn" title="Home">🏠</a>
  </div>
  <div class="version-count" id="version-count"></div>
</div>

<div class="content">
  <div class="loading" id="loading">Loading versions...</div>
  <div id="main-content" style="display:none"></div>
</div>

<script>
// ══ LOAD & RENDER ═══════════════════════════════════════════════════
fetch('versions.json?' + Date.now())
  .then(r => r.json())
  .then(versions => render(versions))
  .catch(() => showEmpty());

function render(versions) {
  document.getElementById('loading').style.display = 'none';
  const main = document.getElementById('main-content');
  main.style.display = 'block';

  if (!versions || !versions.length) { showEmpty(); return; }

  // Update header count
  document.getElementById('version-count').textContent =
    `${versions.length} saved version${versions.length !== 1 ? 's' : ''}`;

  const latest = versions[0];

  // ── Current Version Banner ──
  let html = `
    <div class="current-banner">
      <div class="current-label">✨ Current Version</div>
      <div class="current-name">${esc(latest.name)}</div>
      <div class="current-date">${formatDate(latest.date)}</div>
      <div class="current-desc">${esc(latest.description)}</div>
    </div>
  `;

  // ── Timeline ──
  html += '<div class="timeline">';
  versions.forEach((v, i) => {
    const isCurrent = (i === 0);
    const fileExt = f => f.split('.').pop();
    const fileBadges = v.files.map(f =>
      `<span class="file-badge ${fileExt(f)}">${esc(f)}</span>`
    ).join('');

    const restoreCmd = `git checkout ${v.id} -- ${v.files.join(' ')}`;

    html += `
      <div class="timeline-item">
        <div class="timeline-track">
          <div class="timeline-dot ${isCurrent ? 'current' : ''}"></div>
          <div class="timeline-line"></div>
        </div>
        <div class="version-card">
          <div class="vc-header">
            <div class="vc-name">${esc(v.name)}</div>
            <div class="vc-date">${formatDate(v.date)} · ${v.id}</div>
          </div>
          <div class="vc-desc">${esc(v.description)}</div>
          <div class="vc-files">${fileBadges}</div>
          ${isCurrent
            ? `<button class="restore-btn is-current" disabled>✅ This is your current version</button>`
            : `<button class="restore-btn" onclick="copyRestore(this, '${v.id}', '${v.files.join(' ')}')">📋 Copy Restore Command</button>`
          }
        </div>
      </div>
    `;
  });
  html += '</div>';

  // ── Help Card ──
  html += `
    <div class="help-card">
      <div class="help-title">How to Restore a Version</div>
      <div class="help-step">
        <div class="help-num">1</div>
        <div class="help-text"><strong>Easiest way:</strong> Tell Claude Code<br>"Restore to v1" — and Claude does the rest</div>
      </div>
      <div class="help-step">
        <div class="help-num">2</div>
        <div class="help-text"><strong>Manual way:</strong> Tap "Copy Restore Command" on any version, then paste it in your terminal</div>
      </div>
      <div class="help-step">
        <div class="help-num">3</div>
        <div class="help-text"><strong>No risk:</strong> Restoring doesn't delete anything — it brings old files back as new changes you can review</div>
      </div>
      <div class="help-note">
        💡 <strong>Tip:</strong> Every time Claude Code upgrades your apps, a new version is automatically saved here. You'll always be able to go back.
      </div>
    </div>
  `;

  main.innerHTML = html;
}

// ══ COPY RESTORE COMMAND ════════════════════════════════════════════
function copyRestore(btn, hash, files) {
  const cmd = `git checkout ${hash} -- ${files}`;
  navigator.clipboard.writeText(cmd).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '✅ Copied! Paste in terminal or tell Claude';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 Copy Restore Command';
    }, 3000);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = cmd;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.innerHTML = '✅ Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 Copy Restore Command';
    }, 3000);
  });
}

// ══ HELPERS ═════════════════════════════════════════════════════════
function formatDate(dateStr) {
  try {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch(e) {
    return dateStr;
  }
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showEmpty() {
  document.getElementById('loading').style.display = 'none';
  const main = document.getElementById('main-content');
  main.style.display = 'block';
  main.innerHTML = `
    <div class="empty-state">
      <div class="icon">📭</div>
      <h3>No versions saved yet</h3>
      <p>When Claude Code makes changes to your apps, versions will appear here automatically.</p>
    </div>
  `;
}
</script>
</body>
</html>
